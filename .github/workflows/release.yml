name: Release Overyn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Publish Overyn v0.4.0
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      RELEASE_TAG: v0.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Publish GitHub Release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping publication."
            exit 0
          fi
          installer=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' -print -quit)
          test -n "$installer"
          gh release create "$RELEASE_TAG" "$installer" \
            --target "$GITHUB_SHA" \
            --title "Overyn v0.4.0" \
            --generate-notes
