name: Validate and build Overyn for Windows

on:
  workflow_dispatch:
  push:
    branches: [feat/overyn-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        id: lint
        run: npx eslint . --format json --output-file eslint-report.json
      - name: Upload lint diagnostics
        if: failure() && steps.lint.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 1
      - name: Test frontend
        run: npm test
      - name: Test Rust
        id: rust_test
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee rust-test.log
      - name: Upload Rust diagnostics
        if: failure() && steps.rust_test.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-report
          path: rust-test.log
          retention-days: 1
      - name: Build Windows installer
        id: tauri_build
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build 2>&1 | tee tauri-build.log
      - name: Upload build diagnostics
        if: failure() && steps.tauri_build.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-report
          path: tauri-build.log
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: Overyn-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
